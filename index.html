<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>护理用药提醒</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">💊</div>
        <div>
          <h1>护理用药提醒</h1>
          <p>按时服药，照顾好自己</p>
        </div>
      </div>

      <div class="clock-card" aria-label="当前时间">
        <span class="clock-label">当前时间</span>
        <strong class="clock-time" id="currentTime">--:--:--</strong>
        <span class="clock-date" id="currentDate">--</span>
      </div>
    </header>

    <main>
      <section class="notify-panel" aria-labelledby="notificationTitle">
        <div class="notify-main">
          <div class="notify-icon" aria-hidden="true">🔔</div>
          <div class="notify-copy">
            <h2 id="notificationTitle">系统通知</h2>
            <p id="notificationStatus" aria-live="polite">正在检查通知权限…</p>
          </div>
        </div>
        <button class="notify-btn" id="notificationButton" type="button">开启通知</button>
      </section>

      <section class="overview-card" aria-labelledby="overviewTitle">
        <div class="overview-heading">
          <div>
            <h2 id="overviewTitle">今日概览</h2>
            <p class="overview-subtitle">今天的用药完成情况</p>
          </div>
          <span class="overview-tag">今天</span>
        </div>

        <div class="overview-stats">
          <div class="overview-stat">
            <span class="overview-value" id="overviewTotal">0</span>
            <span class="overview-label">应服</span>
          </div>
          <div class="overview-stat is-taken">
            <span class="overview-value" id="overviewTaken">0</span>
            <span class="overview-label">已服</span>
          </div>
          <div class="overview-stat is-pending">
            <span class="overview-value" id="overviewPending">0</span>
            <span class="overview-label">待服</span>
          </div>
        </div>

        <div
          class="overview-progress"
          id="overviewProgressBar"
          role="progressbar"
          aria-label="今日服药完成进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span id="overviewProgress"></span>
        </div>
        <p class="sr-only" id="overviewSummary" aria-live="polite"></p>
      </section>

      <section class="card" id="formCard" aria-labelledby="formTitle">
        <h2 id="formTitle" aria-live="polite">添加药品</h2>

        <form id="medicineForm" novalidate>
          <div class="field" id="nameField">
            <label for="medicineName">
              药品名称 <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              id="medicineName"
              name="name"
              type="text"
              maxlength="40"
              autocomplete="off"
              placeholder="例如：阿司匹林肠溶片"
              aria-describedby="nameError"
              required
            >
            <p class="error-text" id="nameError" role="alert"></p>
          </div>

          <div class="form-grid">
            <div class="field">
              <label for="dosage">剂量</label>
              <input
                id="dosage"
                name="dosage"
                type="text"
                maxlength="30"
                autocomplete="off"
                placeholder="例如：1 片 / 5 ml"
              >
            </div>

            <div class="field" id="timeField">
              <label for="reminderTime">
                提醒时间 <span class="required-mark" aria-hidden="true">*</span>
              </label>
              <input
                id="reminderTime"
                name="time"
                type="time"
                aria-describedby="timeError"
                required
              >
              <p class="error-text" id="timeError" role="alert"></p>
            </div>
          </div>

          <div class="field">
            <label for="note">备注</label>
            <textarea
              id="note"
              name="note"
              rows="2"
              maxlength="100"
              placeholder="例如：饭后服用，多喝温水"
            ></textarea>
          </div>

          <div class="form-actions">
            <button class="submit-btn" id="submitButton" type="submit">
              <span id="submitIcon" aria-hidden="true">＋</span>
              <span id="submitButtonText">添加提醒</span>
            </button>
            <button class="cancel-btn" id="cancelEditButton" type="button" hidden>
              取消编辑
            </button>
          </div>
        </form>
      </section>

      <section class="card" aria-labelledby="listTitle">
        <div class="list-heading">
          <h2 id="listTitle">用药清单</h2>
          <span class="count-badge" id="medicineCount">共 0 项</span>
        </div>

        <p class="list-hint">每天按设定时间提醒一次；可标记已服、编辑或删除药品。</p>

        <div class="reminder-banner" id="reminderBanner" role="alert" hidden>
          <div class="reminder-banner-copy">
            <strong>⏰ 用药时间到了</strong>
            <p id="reminderBannerText"></p>
          </div>
          <button
            class="banner-close"
            id="dismissReminder"
            type="button"
            aria-label="关闭页面内提醒"
          >×</button>
        </div>

        <ul class="medicine-list" id="medicineList"></ul>

        <div class="empty-state" id="emptyState">
          <div class="empty-icon" aria-hidden="true">🗓️</div>
          <p class="empty-title">还没有添加药品</p>
          <p class="empty-desc">在上方填写药品信息，添加后就会出现在这里。</p>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      数据仅保存在当前浏览器中，不会上传 · 提醒不能替代医嘱
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
